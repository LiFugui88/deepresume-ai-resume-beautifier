    :root {

      color: var(--color-dark);
      font-family: 'Plus Jakarta Sans', 'Noto Sans SC', sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    /* Custom Scrollbar */
    ::-webkit-scrollbar {

    }

    ::-webkit-scrollbar-track {

    }

    }

    /* Print Optimization */
    @media print {

        margin: 0;
        size: auto;

        -webkit-print-color-adjust: exact;

      }

      }
    }
  </style>
